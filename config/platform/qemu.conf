base_arch qemu
base_arch armv8

cflags -march=armv8.5-a+rng -mcpu=cortex-x1
ldflags -mcpu=cortex-x1

configs PLATFORM_QEMU=1

configs PLATFORM_SVM_IPA_BASE=0x28800000
configs PLATFORM_SVM_IPA_SIZE=0x07ffffff

configs PLATFORM_RESTRICTED_IRQ_SHARE_ALLOWED=1
configs PLATFORM_IOMEM_STATIC_SHARE_ALLOWED=1

configs PLATFORM_GLOBAL_IRQ_ALLOC_BASE=960U

sub_directory platform/qemu/target/qemu

configs CONFIG_WATCHDOG_BARK_VIRQ=32
configs CONFIG_WATCHDOG_BITE_VIRQ=33
